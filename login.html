<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Alicerce Patrimonial</title>
<link rel="icon" href="assets/avaner-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <img src="assets/avaner-icon.png" alt="Avaner">
    <h1>Painel de Lançamento</h1>
    <div class="tagline">Alicerce Patrimonial</div>

    <div id="login-picker" class="login-picker"></div>

    <form id="login-form" hidden>
      <button type="button" id="login-back" class="login-back">← trocar pessoa</button>
      <div class="login-selected" id="login-selected"></div>
      <input type="hidden" id="login-email">
      <div>
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="login-error" id="login-error" hidden></div>
      <button type="submit" id="login-submit">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>window.setupLoginForm();</script>
</body>
</html>
